name: Render 24/7 Keep-Alive

on:
  schedule:
    # Run every 10 minutes (UTC) to keep Render service awake
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping C3 Render Public Endpoint
        run: |
          echo "Pinging C3 AI Service on Render..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://c3-service-il4m.onrender.com/api/health)
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::warning ::Expected 200, got $STATUS"
          else
            echo "Service is healthy and active!"
          fi
